{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<section class="login-panel">
  <h2>Staff Login</h2>
  <form method="post" class="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button type="submit">Login</button>
  </form>
  <p class="auth-link">If you do not have an account, ask a staff member to create a viewer account for you.</p>
  
  <hr style="margin: 20px 0;">
  
  <h3>Or view as guest</h3>
  <p style="font-size: 0.9em; margin-bottom: 10px;">View the queue display in real time without logging in</p>
  <form method="get" action="{{ url_for('public_display') }}">
    <button type="submit" class="public-view-button">View Public Display</button>
  </form>
</section>
{% endblock %}
