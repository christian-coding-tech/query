{% extends "base.html" %}

{% block title %}Queue System{% endblock %}

{% block content %}
<section class="controls">
  <form method="post" class="add-form">
    <label for="name">Add to queue</label>
    <input id="name" name="name" type="text" placeholder="Enter name" autocomplete="off" />
    <button type="submit">Add</button>
  </form>

  <div class="action-buttons">
    <form method="post" action="{{ url_for('serve') }}">
      <button type="submit" class="next-button">NEXT QUEUE</button>
    </form>
    <form method="post" action="{{ url_for('clear') }}">
      <button type="submit" class="danger">Clear queue</button>
    </form>
  </div>
</section>

<section class="queue-list">
  <h2>Current queue</h2>
  {% if queue %}
  <ol>
    {% for item in queue %}
    <li>
      <strong>{{ item.name }}</strong>
      <span>id={{ item.id }}</span>
      <small>{{ item.created_at }}</small>
    </li>
    {% endfor %}
  </ol>
  {% else %}
  <p class="empty">No items in the queue yet.</p>
  {% endif %}
</section>
{% endblock %}
